name: TestPlugin
version: 1.0
main: com.test.plugin.TestPlugin
api-version: 1.20
description: A simple test plugin created by Jay
author: Jay
commands:
  greet:
    description: Say hello to a player
    usage: /greet <player>
    permission: testplugin.greet
  serverinfo:
    description: Show server information
    usage: /serverinfo
    permission: testplugin.serverinfo
permissions:
  testplugin.greet:
    description: Allows using /greet
    default: true
  testplugin.serverinfo:
    description: Allows using /serverinfo
    default: op
