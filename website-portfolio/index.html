<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jay's Web Dev Portfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; }
        .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
        .hero h1 { font-size: 3rem; margin-bottom: 1rem; }
        .hero p { font-size: 1.2rem; color: #888; margin-bottom: 2rem; }
        .btn { display: inline-block; padding: 12px 30px; background: #00d4ff; color: #000; text-decoration: none; border-radius: 5px; font-weight: bold; transition: 0.3s; margin: 5px; }
        .btn:hover { background: #00b8d4; transform: translateY(-2px); }
        .section { padding: 80px 20px; text-align: center; }
        .section h2 { font-size: 2rem; margin-bottom: 3rem; }
        .skill-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .skill-card { background: #1a1a2e; padding: 30px; border-radius: 10px; transition: 0.3s; }
        .skill-card:hover { transform: translateY(-5px); background: #16213e; }
        .skill-card h3 { color: #00d4ff; margin-bottom: 10px; }
        .contact { background: #16213e; }
    </style>
</head>
<body>
    <section class="hero">
        <div>
            <h1>Jay</h1>
            <p>Web Developer & Minecraft Server Specialist</p>
            <a href="../" class="btn">Back to Main Portfolio</a>
        </div>
    </section>
    <section class="section">
        <h2>Skills</h2>
        <div class="skill-grid">
            <div class="skill-card"><h3>Frontend</h3><p>HTML, CSS, JavaScript, Responsive Design</p></div>
            <div class="skill-card"><h3>Backend</h3><p>Node.js, Python, PHP, Databases</p></div>
            <div class="skill-card"><h3>Minecraft</h3><p>Paper/Spigot, Plugins, LuckPerms</p></div>
            <div class="skill-card"><h3>Tools</h3><p>Git, Deployment, Performance</p></div>
        </div>
    </section>
    <section class="section contact">
        <h2>Contact</h2>
        <p>Discord: underworld_4</p>
    </section>
</body>
</html>
