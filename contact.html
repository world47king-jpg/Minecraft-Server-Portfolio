<title>Contact Jay</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#06090f;color:#f1f5f9;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.container{max-width:500px;width:100%}

form{display:flex;flex-direction:column;gap:1rem}

textarea{min-height:120px;resize:vertical}
button{padding:.9rem 2rem;background:linear-gradient(135deg,#00e5ff,#a855f7);border:none;border-radius:10px;color:#06090f;font-weight:700;font-size:1rem;cursor:pointer;transition:.3s}
